name: 🐳 Build and Push Docker Image

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

env:
  DOCKER_USERNAME: jcpsandoval
  IMAGE_NAME: camandre-landing

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏷️ Set Docker tag
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "full_tag=${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            echo "tag=development" >> $GITHUB_OUTPUT
            echo "full_tag=${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:development" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.set-tag.outputs.full_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build Complete
        run: |
          echo "✅ Image: ${{ steps.set-tag.outputs.full_tag }}"
          echo "🔽 Pull: docker pull ${{ steps.set-tag.outputs.full_tag }}"

      # 🚀 AUTO-DEPLOY (solo en main)
      - name: 🚀 Deploy to Production
        if: steps.set-tag.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/apps/landing-page
            ./deploy.sh
