name: 🐳 CI/CD — Camandre Landing

# The site is served from hl-core-01, a self-hosted machine that is NOT reachable
# from the public internet: it has no public SSH and sits behind CGNAT, with
# Cloudflare Tunnel as its only inbound path. A GitHub runner therefore cannot
# reach it the way it reached the old VPS.
#
# The deploy job joins the tailnet as an ephemeral, tagged node, which gives it a
# route to the host without exposing anything new to the internet. The node is
# torn down when the job ends.

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

# The refs below are floating major tags, not exact pins: each step comment
# records the release its major resolved to when audited against the GitHub
# releases API on 2026-08-24, and upstream can re-point a major afterwards.
# Every retained `with:` input was confirmed present in the new major's
# action.yml at that release. A ref that does not resolve aborts the whole job
# at resolution time, and the deploy path runs only on push, never on a PR.

env:
  DOCKER_USERNAME: jcpsandoval
  IMAGE_NAME: camandre-landing

jobs:
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest

    # Runs on pull requests too, which is the whole point: until this job
    # existed the pipeline only started after the merge, so a broken change was
    # discovered in production rather than in review.
    steps:
      - name: 📥 Checkout
        # actions/checkout resolved to v7.0.1 on 2026-08-24
        uses: actions/checkout@v7

      - name: ⚙️ Set up Node
        # actions/setup-node resolved to v7.0.0 on 2026-08-24
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: 📦 Install
        run: yarn install --frozen-lockfile

      - name: 🔎 Typecheck
        # `astro check` resolves component props, imports and the content
        # collections that a bare `astro build` will happily compile around.
        run: yarn typecheck

      - name: 🏗️ Build
        # The Dockerfile runs this same command. Running it here means a build
        # failure costs a red check instead of a failed deploy.
        run: yarn build

      - name: 🧪 Test
        # Asserts over dist/, so it has to follow the build. Covers the metadata
        # contract `astro check` cannot see: one non-empty title and description
        # per page, unique across pages, inside the documented length budget.
        run: yarn test

  build-and-push:
    name: 🏗️ Build & Push
    runs-on: ubuntu-latest
    needs: verify

    # Pull requests stop at verify. Publishing an image for a branch nobody
    # deploys would burn a registry tag and hand Docker Hub credentials to a run
    # triggered by a fork.
    if: github.event_name != 'pull_request'
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      should_deploy: ${{ steps.set-tag.outputs.should_deploy }}

    steps:
      - name: 📥 Checkout
        # actions/checkout resolved to v7.0.1 on 2026-08-24
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        # docker/setup-buildx-action resolved to v4.3.0 on 2026-08-24
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to Docker Hub
        # docker/login-action resolved to v4.6.0 on 2026-08-24
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏷️ Set tag
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "tag=development" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build and Push
        # docker/build-push-action resolved to v7.3.0 on 2026-08-24
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to hl-core-01
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.should_deploy == 'true'

    # Only one deploy at a time. Two concurrent runs would race on `docker
    # compose up` and the loser would report a success it did not perform.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: 🔗 Join the tailnet
        # tailscale/github-action resolved to v4.1.3 on 2026-08-24
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # The ACL grants this tag SSH to hl-core-01 and nothing else.
          tags: tag:ci
          version: latest

      - name: 🔐 Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned rather than trusted on first use: a runner
          # that accepts any key would hand the deploy to whatever answers on
          # that address.
          printf '%s\n' "${{ secrets.SERVER_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 🚀 Deploy
        run: |
          # The key is restricted server-side by a forced command: it can only
          # run the deploy script, with no shell, no pty and no forwarding. The
          # command sent here is therefore irrelevant — the server decides.
          #
          # No `|| true` and no `set +e`: if the script exits non-zero the step
          # fails and the run goes red. A deploy that fails silently is worse
          # than no deploy at all.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=30 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"

      - name: ✅ Verify the site is live
        # Proves the deploy from OUTSIDE the tailnet, through Cloudflare, which
        # is the path real visitors take. The healthcheck inside the container
        # only proves the container answers itself.
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://camandrefactory.com/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "camandrefactory.com -> 200"
              exit 0
            fi
            echo "attempt $i: got $code, retrying..."
            sleep 6
          done
          echo "::error::the site did not answer 200 after the deploy"
          exit 1

      - name: 🧹 Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
