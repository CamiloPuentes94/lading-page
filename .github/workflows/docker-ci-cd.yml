name: 🐳 CI/CD — Camandre Landing

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

env:
  DOCKER_USERNAME: jcpsandoval
  IMAGE_NAME: camandre-landing

jobs:
  build-and-push:
    name: 🏗️ Build & Push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      should_deploy: ${{ steps.set-tag.outputs.should_deploy }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏷️ Set tag
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "tag=development" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.should_deploy == 'true'

    steps:
      - name: 🚀 Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: RESEND_API_KEY,RESEND_AUDIENCE_ID
          script: |
            mkdir -p $HOME/apps/landing-page
            printf "RESEND_API_KEY=%s\nRESEND_AUDIENCE_ID=%s\n" "$RESEND_API_KEY" "$RESEND_AUDIENCE_ID" > $HOME/apps/landing-page/.env
            docker pull jcpsandoval/camandre-landing:latest
            docker stop landing 2>/dev/null || true
            docker rm landing 2>/dev/null || true
            docker run -d \
              --name landing \
              --restart unless-stopped \
              --network red_infraestructura \
              --env-file $HOME/apps/landing-page/.env \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.landing.rule=Host(\`camandrefactory.com\`) || Host(\`www.camandrefactory.com\`)" \
              --label "traefik.http.routers.landing.entrypoints=websecure" \
              --label "traefik.http.routers.landing.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.landing.loadbalancer.server.port=4321" \
              jcpsandoval/camandre-landing:latest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
