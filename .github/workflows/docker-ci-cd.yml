name: 🐳 CI/CD — Camandre Landing

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

env:
  DOCKER_USERNAME: jcpsandoval
  IMAGE_NAME: camandre-landing

jobs:
  build-and-push:
    name: 🏗️ Build & Push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      should_deploy: ${{ steps.set-tag.outputs.should_deploy }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏷️ Set tag
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "tag=development" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.should_deploy == 'true'

    steps:
      - name: 🚀 Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RESEND_API_KEY,RESEND_AUDIENCE_ID
          script: |
            set -e
            DEPLOY_DIR="$HOME/apps/landing-page"
            mkdir -p "$DEPLOY_DIR"
            printf "RESEND_API_KEY=%s\nRESEND_AUDIENCE_ID=%s\n" "$RESEND_API_KEY" "$RESEND_AUDIENCE_ID" > "$DEPLOY_DIR/.env"
            cat > "$DEPLOY_DIR/docker-compose.yml" << 'EOF'
            services:
              landing:
                image: jcpsandoval/camandre-landing:latest
                restart: unless-stopped
                env_file: .env
                networks:
                  - red_infraestructura
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.landing.rule=Host(`camandrefactory.com`) || Host(`www.camandrefactory.com`)"
                  - "traefik.http.routers.landing.entrypoints=websecure"
                  - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
                  - "traefik.http.services.landing.loadbalancer.server.port=4321"
            networks:
              red_infraestructura:
                external: true
                name: red_infraestructura
            EOF
            cd "$DEPLOY_DIR"
            echo "=== whoami ===" && whoami
            echo "=== docker context ===" && docker context show
            echo "=== docker networks ===" && docker network ls
            echo "=== compose file ===" && cat docker-compose.yml
            docker compose pull
            docker compose up -d
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
